name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check project files exist
        run: |
          test -f package.json || { echo "ERROR: package.json missing in repo root"; exit 1; }
          test -f capacitor.config.json || { echo "ERROR: capacitor.config.json missing in repo root"; exit 1; }
          test -f www/index.html || { echo "ERROR: www/index.html missing"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create and sync the Android project
        run: |
          npx --yes @capacitor/cli@6 add android
          npx --yes @capacitor/cli@6 sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: symphony-no-9-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
